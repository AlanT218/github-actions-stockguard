name: Validaciones StockGuard
run-name: "${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event_name == 'workflow_dispatch' && 'Validacion 7 - Ejecucion manual exitosa' || github.event.head_commit.message }}"

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validar-python:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis
        run: python -m compileall src tests

      - name: Ejecutar pruebas
        run: pytest -v